name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: relative markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: this corpus cross-links itself; CLAUDE.md forbids vendor URLs as
          # primary truth, so CI verifies relative targets only.
          args: --offline --no-progress --include-fragments -- './**/*.md'
          fail: true
